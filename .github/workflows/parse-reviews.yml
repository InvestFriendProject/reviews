name: Парсинг отзывов и публикация

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main, master ]

jobs:
  parse:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    
    - name: Run parser
      run: python sync_reviews.py
    
    - name: Prepare for deployment
      run: |
        mkdir -p public
        cp reviews.json public/
        echo '<!DOCTYPE html>
        <html>
        <head><meta charset="UTF-8"><title>Отзывы</title></head>
        <body>
          <h1>reviews.json</h1>
          <pre id="data"></pre>
          <script>
            fetch("reviews.json")
              .then(r => r.json())
              .then(d => document.getElementById("data").textContent = JSON.stringify(d, null, 2))
              .catch(e => document.getElementById("data").textContent = "Ошибка загрузки: " + e);
          </script>
        </body>
        </html>' > public/index.html
    
    - name: Add CORS headers
      run: |
        echo "/reviews.json" > public/_headers
        echo "  Access-Control-Allow-Origin: *" >> public/_headers
        echo "  Access-Control-Allow-Methods: GET" >> public/_headers
        echo "  Content-Type: application/json" >> public/_headers
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: reviews-data
        path: reviews.json
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        keep_files: false
